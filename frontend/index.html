<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ورود | سیستم مدیریت</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css">
<link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>
<div class="login-wrapper">
  <div class="login-card">
    <div class="login-logo"><i class="fa-solid fa-briefcase"></i></div>
    <h1>ورود به سیستم</h1>
    <p class="subtitle">مدیریت قرارداد و گزارش کار</p>

    <div id="error" class="hidden" style="background:#fee2e2;color:#991b1b;padding:10px 14px;border-radius:8px;margin-bottom:16px"></div>

    <form id="loginForm">
      <div class="form-group">
        <label>نام کاربری</label>
        <input type="text" name="username" class="form-control" required autofocus>
      </div>
      <div class="form-group">
        <label>رمز عبور</label>
        <input type="password" name="password" class="form-control" required>
      </div>
      <button class="btn btn-primary" style="width:100%;justify-content:center;padding:12px">
        <i class="fa-solid fa-right-to-bracket"></i> ورود
      </button>
    </form>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="/assets/js/api.js"></script>
<script>
document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = e.target.querySelector('button');
  const errBox = document.getElementById('error');
  errBox.classList.add('hidden');

  btn.disabled = true;
  btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> در حال ورود...';

  try {
    const fd = new FormData(e.target);
    const data = await apiFetch('/auth.php?action=login', {
      method: 'POST',
      body: { username: fd.get('username'), password: fd.get('password') }
    });
    if (data.csrf) csrfToken = data.csrf;
    location.href = '/dashboard.html';
  } catch (err) {
    errBox.textContent = err.message;
    errBox.classList.remove('hidden');
    btn.disabled = false;
    btn.innerHTML = '<i class="fa-solid fa-right-to-bracket"></i> ورود';
  }
});
</script>
</body>
</html>
